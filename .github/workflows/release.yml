# Builds and publishes a release when a release tag is pushed.
#
# 'ant release' is the same command a release is built with by hand: clean
# tree, compile, run the tests, package, then print the version out of the
# jar it just built. Nothing here reimplements the build; if a step needs
# changing it belongs in build.xml so that hand-built and CI-built jars
# cannot drift apart.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21 for the same reason build.xml defaults test.jdk.version to
      # it: RegrDirectoryRecursionTest mocks java.lang.Runtime, which
      # Mockito 3 cannot do once it is final, as it is from JDK 26.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ant happens to be on the current runner images, but that is the
      # runner's promise and not ours, and a release that fails because the
      # image was trimmed is a bad day. Install it outright.
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # The tag is the only thing that names a version: -Dversion stamps it
      # into the jar manifest, which is where Main reads it back from.
      # -Dtest.jdk because build.xml locates the test JDK with java_home,
      # which is macOS only.
      - name: Build and test
        run: ant release -Dtest.jdk="$JAVA_HOME" -Dversion="${GITHUB_REF_NAME#v}"

      # Ask the built artifact what it is, rather than trusting that the
      # property arrived. This is the check that the tag and the jar agree.
      - name: Check the jar reports the tagged version
        run: |
          expected="Jregr version ${GITHUB_REF_NAME#v}"
          actual=$(java -jar jregr.jar -version)
          if [ "$actual" != "$expected" ]; then
            echo "Expected '$expected', jar says '$actual'." >&2
            exit 1
          fi
          echo "$actual"

      # The wrapper goes along with the jar: it expects to sit next to it,
      # and it is what a consumer actually invokes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            jregr.jar jregr
